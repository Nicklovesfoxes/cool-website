---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {{ page.date | date: "%B %-d, %Y" }}{% if page.description %} | {{ page.description }}{% endif %}
    </p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
